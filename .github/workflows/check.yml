name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: jgus-org/flake-lib/.github/actions/fleet-nix-cache@v1
        with:
          token: ${{ secrets.ATTIC_TOKEN }}
      - name: Build Codex with process SHELL regression tests
        run: nix build --no-link .#checks.x86_64-linux.codex
