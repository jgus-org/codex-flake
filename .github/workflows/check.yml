name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7
        with:
          use-gha-cache: true
          use-flakehub: false
      - name: Build Codex with process SHELL regression tests
        run: nix build --no-link .#checks.x86_64-linux.codex
