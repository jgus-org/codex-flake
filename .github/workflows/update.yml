name: Update branches

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

env:
  MINIMUM_TRACKING_VERSION: "0.153.4"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.plan.outputs.base_sha }}
      versions: ${{ steps.plan.outputs.versions }}
      newest_stable: ${{ steps.plan.outputs.newest_stable }}
      maintenance: ${{ steps.plan.outputs.maintenance }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7
        with:
          use-gha-cache: true
          use-flakehub: false
      - name: Discover tracked versions and specification base
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          plan=$(nix run .#update-branches -- list)
          base_sha=$(jq -r '.baseSha' <<<"${plan}")
          # Codex alpha releases are not consumed here. Exclude them from both
          # maintenance and publication so they do not consume runners or
          # create aggregate candidates.
          versions=$(jq -c '[.versions[] | select(.version | test("(^|[.+-])alpha"; "i") | not)]' <<<"${plan}")
          newest_stable=$(jq -c '[.[] | select(.stable)][0] // null' <<<"${versions}")
          maintenance=$(jq -c --argjson newest_stable "${newest_stable}" '[.[] | select(.version != ($newest_stable.version // ""))]' <<<"${versions}")
          {
            echo "base_sha=${base_sha}"
            echo "versions=${versions}"
            echo "newest_stable=${newest_stable}"
            echo "maintenance=${maintenance}"
          } >> "${GITHUB_OUTPUT}"

  newest-stable:
    needs: discover
    if: ${{ needs.discover.outputs.newest_stable != 'null' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7
        with:
          use-gha-cache: true
          use-flakehub: false
      - name: Refresh newest stable
        env:
          BASE_SHA: ${{ needs.discover.outputs.base_sha }}
          ENTRY: ${{ needs.discover.outputs.newest_stable }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r '.version' <<<"${ENTRY}")
          upstream_version=$(jq -r '.upstreamVersion' <<<"${ENTRY}")
          nix run .#update-branches -- refresh \
            --base-sha "${BASE_SHA}" \
            --version "${version}" \
            --upstream-version "${upstream_version}"

      - name: Publish newest stable early
        continue-on-error: true
        env:
          BASE_SHA: ${{ needs.discover.outputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
          VERSIONS: ${{ needs.discover.outputs.versions }}
        run: |
          nix run .#update-branches -- publish \
            --base-sha "${BASE_SHA}" \
            --versions-json "${VERSIONS}"

  maintenance:
    needs: [discover, newest-stable]
    if: ${{ always() && needs.discover.result == 'success' && needs.discover.outputs.maintenance != '[]' }}
    strategy:
      fail-fast: false
      # Avoid a cache-service thundering herd as tracked stable releases grow.
      max-parallel: 4
      matrix:
        entry: ${{ fromJson(needs.discover.outputs.maintenance) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7
        with:
          use-gha-cache: true
          use-flakehub: false
      - name: Refresh exact version
        env:
          BASE_SHA: ${{ needs.discover.outputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_VERSION: ${{ matrix.entry.upstreamVersion }}
          VERSION: ${{ matrix.entry.version }}
        run: |
          nix run .#update-branches -- refresh \
            --base-sha "${BASE_SHA}" \
            --version "${VERSION}" \
            --upstream-version "${UPSTREAM_VERSION}"

  publish:
    needs: [discover, newest-stable, maintenance]
    if: ${{ always() && needs.discover.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7
        with:
          use-gha-cache: true
          use-flakehub: false
      - name: Publish aggregate pointers
        env:
          BASE_SHA: ${{ needs.discover.outputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
          VERSIONS: ${{ needs.discover.outputs.versions }}
        run: |
          nix run .#update-branches -- publish \
            --base-sha "${BASE_SHA}" \
            --versions-json "${VERSIONS}"
